<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JobTok · Видеообяви за работа</title>
  <meta name="description" content="JobTok изработва кратки вертикални видеообяви за работа. Пакети от 39 €.">
  <meta name="theme-color" content="#09090f">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 80% -10%, #2a0f2a 0%, transparent 60%),
                  radial-gradient(900px 500px at -10% 10%, #0b2530 0%, transparent 55%), #09090f;
      color: #f2f2f7;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .m {
      display: inline-grid; place-items: center;
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, #ff3d77, #7c3aed 60%, #22d3ee);
      font-weight: 800; font-size: 28px; color: #fff;
    }
    h1 { font-size: 28px; letter-spacing: -0.02em; margin: 14px 0 8px; }
    h1 span { color: #ff3d77; }
    p { color: #a1a1b5; margin: 0 0 8px; max-width: 28em; }
    a {
      display: inline-block; margin-top: 18px; padding: 14px 22px; min-height: 48px;
      border-radius: 14px; background: linear-gradient(135deg, #ff3d77, #a21caf);
      color: #fff; text-decoration: none; font-weight: 600; line-height: 20px;
    }
    a[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="m" aria-hidden="true">J</div>
    <h1>Job<span>Tok</span></h1>
    <p id="s">Отваряме JobTok…</p>
    <a id="go" href="#" hidden>Към JobTok →</a>
  </main>
  <script>
    // Stable address: look up the current JobTok URL and go there immediately.
    // Only https://*.tnls.lt is accepted (no open redirect). Deep links are forwarded
    // (this file is also 404.html, so /generator and /order still work).
    (async () => {
      const s = document.getElementById('s');
      const go = document.getElementById('go');
      const ok = (u) => /^https:\/\/[a-z0-9-]+\.tnls\.lt$/.test(u) ? u : null;
      const base = '/jobtok-site';
      const path = location.pathname.startsWith(base)
        ? location.pathname.slice(base.length) || '/'
        : location.pathname || '/';
      const destOf = (origin) => origin + (path === '/' ? '/' : path) + location.search + location.hash;

      async function fromApi() {
        const r = await fetch('https://api.github.com/repos/rtuck77/jobtok-site/contents/url.json?ref=main', {
          cache: 'no-store',
          headers: { Accept: 'application/vnd.github.raw+json' }
        });
        if (!r.ok) throw 0;
        const j = await r.json();
        return ok(j && j.url);
      }
      async function fromFile() {
        const r = await fetch(new URL('url.json?t=' + Date.now(), location.href), { cache: 'no-store' });
        if (!r.ok) throw 0;
        const j = await r.json();
        return ok(j && j.url);
      }

      let origin = null;
      for (const fn of [fromApi, fromFile]) {
        try { origin = await fn(); } catch (e) { origin = null; }
        if (origin) break;
      }
      try {
        if (!origin) throw 0;
        const dest = destOf(origin);
        go.href = dest;
        go.hidden = false;
        location.replace(dest);
      } catch (e) {
        s.textContent = 'Временно недостъпно. Моля, опитайте отново след минута.';
        go.hidden = true;
      }
    })();
  </script>
  <noscript>
    <p>Включете JavaScript, за да отворите JobTok, или опреснете страницата.</p>
  </noscript>
</body>
</html>
